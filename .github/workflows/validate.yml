name: Validate ArtisanPilot
on:
  push:
    branches: [main, feature/geographic-radius-map]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check
      - run: npm test
